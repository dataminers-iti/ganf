<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const g=localStorage.getItem("dm-theme");document.documentElement.dataset.theme=g==="dark"||g==="light"?g:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(_){document.documentElement.dataset.theme="light"}</script>
    <title>Préstamos | SGRSI</title><link rel="icon" type="image/webp" href="../src/shared/assets/logo.webp">    <link rel="stylesheet" href="../src/shared/styles/entradas/internas.css">
    <script type="module" src="../src/app/entries/loans.page.js"></script>
</head>
<body>
    <button type="button" class="dark-btn" onclick="toggleDark()" aria-label="Cambiar a modo oscuro"><i data-icon="luna" class="theme-icon-moon"></i><i data-icon="sol" class="theme-icon-sun" hidden></i></button>
    <div class="section-container">
        <h1>Préstamos de equipos</h1>
        <form id="formPrestamo" class="card" onsubmit="event.preventDefault(); solicitarPrestamo()">
            <h2>Solicitar un préstamo</h2>
            <label for="equipoPrestamo">Equipo disponible</label><select id="equipoPrestamo" required><option value="">Cargando equipos…</option></select>
            <label for="motivoPrestamo">Motivo</label><textarea id="motivoPrestamo" required minlength="5" rows="3"></textarea>
            <label for="cantidadPrestamo">Cantidad</label><input type="number" id="cantidadPrestamo" min="1" value="1" required>
            <label for="fechaPrestamo">Fecha prevista de devolución (opcional)</label><input type="date" id="fechaPrestamo">
            <p id="errorPrestamo" class="feedback" role="alert" aria-live="polite"></p><p id="estadoPrestamo" class="feedback" role="status" aria-live="polite"></p>
            <button type="submit">Enviar solicitud</button>
        </form>
        <div class="tabla-scroll"><table class="tabla-datos"><thead><tr><th>Equipo</th><th>Serie</th><th>Solicitante</th><th>Solicitud</th><th>Devolución prevista</th><th>Estado</th><th id="colAccionesPrestamo" style="display:none">Acciones</th></tr></thead><tbody id="bodyPrestamos"><tr><td colspan="7">Cargando…</td></tr></tbody></table></div>
    </div>
</body>
</html>
