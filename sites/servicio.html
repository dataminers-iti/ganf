<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const g=localStorage.getItem("dm-theme");document.documentElement.dataset.theme=g==="dark"||g==="light"?g:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(_){document.documentElement.dataset.theme="light"}</script>
    <title>Servicio | SGRSI</title>
    <link rel="icon" type="image/webp" href="../src/shared/assets/logo.webp">
    <link rel="stylesheet" href="../src/shared/styles/entradas/internas.css">
    <script type="module" src="../src/app/entries/service-requests.page.js"></script>
</head>
<body>
    <button type="button" class="dark-btn" onclick="toggleDark()" aria-label="Cambiar a modo oscuro"><i data-icon="luna" class="theme-icon-moon"></i><i data-icon="sol" class="theme-icon-sun" hidden></i></button>

    <!-- Formulario (only admin and solicitante) -->
    <div id="formSolicitud" class="card" style="display:none;">
        <h1>Solicitud de Servicio</h1>
        <label for="tipoServicio">Tipo de servicio</label><input type="text" id="tipoServicio" required>
        <label for="descripcionServicio">Descripción del servicio</label><textarea id="descripcionServicio" required rows="3"></textarea>
        <label for="prioridad">Prioridad</label><select id="prioridad" required>
            <option value="">Seleccione prioridad</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
        </select>
        <p id="errorServicio"></p>
        <p id="estadoServicio" class="feedback" role="status" aria-live="polite"></p>
        <button onclick="enviarSolicitud()">Enviar solicitud</button>
    </div>

    <!-- Tabla de solicitudes -->
    <div class="section-container">
        <h1>Solicitudes de Servicio</h1>
        <div class="tabla-scroll">
            <table class="tabla-datos" id="tablaSolicitudes">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Solicitante</th>
                        <th>Técnico</th>
                        <th>Fecha</th>
                        <th id="colAccionesSol" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodySolicitudes">
                    <tr><td colspan="9">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
