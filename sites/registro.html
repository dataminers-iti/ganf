<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const modoOscuro=localStorage.getItem("modo")==="dark";document.documentElement.style.colorScheme=modoOscuro?"dark":"light";if(modoOscuro)document.documentElement.classList.add("dark")}catch(_){}</script>
    <title>Registro | SGRSI</title>
    <link rel="icon" type="image/png" href="../src/shared/assets/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../src/shared/styles/base.css?v=3">
    <link rel="stylesheet" href="../src/shared/styles/tema.css?v=9">
    <link rel="stylesheet" href="../src/shared/styles/componentes.css?v=3">
    <link rel="stylesheet" href="../src/shared/styles/layout.css?v=14">
    <script type="module" src="../src/app/entries/registro.page.js"></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()"><i class="bi bi-moon-stars-fill theme-icon-moon" aria-hidden="true"></i><i class="bi bi-sun-fill theme-icon-sun" aria-hidden="true" hidden></i></button>
    
    <div class="login-container">
        <div class="card">
            <h1>Crear Cuenta</h1>
            <label for="nuevoNombre">Nombre completo</label><input type="text" id="nuevoNombre" required>
            <label for="nuevoCorreo">Correo</label><input type="email" id="nuevoCorreo" required>
            <label for="nuevaClave">Contraseña</label><input type="password" id="nuevaClave" required minlength="8">
            <p id="errorRegistro" style="color:red;"></p>
            <p id="estadoRegistro" class="feedback" role="status" aria-live="polite"></p>
            <button onclick="registro()">Crear cuenta</button>
            <p>¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
