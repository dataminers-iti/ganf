<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const g=localStorage.getItem("dm-theme");document.documentElement.dataset.theme=g==="dark"||g==="light"?g:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(_){document.documentElement.dataset.theme="light"}</script>
    <title>Incidencias | SGRSI</title>
    <link rel="icon" type="image/webp" href="../src/shared/assets/logo.webp">
    <link rel="stylesheet" href="../src/shared/styles/entradas/incidencias.css">
    <script type="module" src="../src/app/entries/incidents.page.js"></script>
</head>
<body class="page-incidencias">
    <button type="button" class="dark-btn" onclick="toggleDark()" aria-label="Cambiar a modo oscuro"><i data-icon="luna" class="theme-icon-moon"></i><i data-icon="sol" class="theme-icon-sun" hidden></i></button>

    <!-- Formulario para crear incidencia -->
    <div class="card incidence-form">
        <div class="incidence-heading"><h1>Registrar incidencia</h1><p>Contanos qué pasó y dónde ocurrió para que podamos ayudarte.</p></div>
        <div class="incidence-fields">
        <div class="incidence-field incidence-field-wide"><label for="titulo">Título de la incidencia</label><input type="text" id="titulo" required></div>
        <div class="incidence-field incidence-field-wide"><label for="descripcionIncidencia">Descripción del problema</label><textarea id="descripcionIncidencia" required rows="3"></textarea></div>
        <div class="incidence-field"><label for="area">Área o departamento</label><input type="text" id="area" required></div>
        <div class="incidence-field"><label for="prioridadIncidencia">Prioridad</label><select id="prioridadIncidencia">
            <option value="media">Prioridad: Media</option>
            <option value="alta">Prioridad: Alta</option>
            <option value="baja">Prioridad: Baja</option>
        </select></div>
        </div>
        <p id="errorIncidencia"></p>
        <p id="estadoIncidencia" class="feedback" role="status" aria-live="polite"></p>
        <button onclick="guardarIncidencia()">Guardar incidencia</button>
    </div>

    <!-- Tabla de incidencias -->
    <div class="section-container incidence-list">
        <div class="incidence-list-heading"><div><h2>Incidencias registradas</h2></div><span class="incidence-list-caption">Consultá el estado de los reportes</span></div>
        <div class="tabla-scroll">
            <table class="tabla-datos" id="tablaIncidencias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Área</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Reportado por</th>
                        <th>Asignado a</th>
                        <th>Fecha</th>
                        <th id="colAccionesInc" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodyIncidencias">
                    <tr><td colspan="10">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <dialog id="dialogoPrioridadIncidencia" class="inc-dialog" aria-labelledby="tituloDialogoPrioridadIncidencia">
        <div class="inc-dialog-card">
            <button type="button" class="inc-dialog-close" aria-label="Cerrar" onclick="document.getElementById('dialogoPrioridadIncidencia').close()"><i data-icon="cerrar"></i></button>
            <h2 id="tituloDialogoPrioridadIncidencia">Cambiar prioridad</h2>
            <label for="nuevaPrioridadIncidencia">Seleccioná la nueva prioridad</label>
            <select id="nuevaPrioridadIncidencia">
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
            </select>
            <p id="errorPrioridadIncidencia" class="inc-dialog-error" role="status" aria-live="polite"></p>
            <div class="inc-dialog-actions">
                <button type="button" class="btn-secundario" onclick="document.getElementById('dialogoPrioridadIncidencia').close()">Cancelar</button>
                <button type="button" id="guardarPrioridadIncidencia" onclick="guardarPrioridadIncidencia()">Guardar prioridad</button>
            </div>
        </div>
    </dialog>

    <dialog id="dialogoBorrarIncidencia" class="inc-dialog" aria-labelledby="tituloDialogoBorrarIncidencia">
        <div class="inc-dialog-card">
            <button type="button" class="inc-dialog-close" aria-label="Cerrar" onclick="document.getElementById('dialogoBorrarIncidencia').close()"><i data-icon="cerrar"></i></button>
            <h2 id="tituloDialogoBorrarIncidencia">Borrar incidencia</h2>
            <p id="mensajeConfirmarBorradoIncidencia" class="inc-dialog-message"></p>
            <p id="errorBorrarIncidencia" class="inc-dialog-error" role="status" aria-live="polite"></p>
            <div class="inc-dialog-actions">
                <button type="button" id="cancelarBorradoIncidencia" class="btn-secundario" onclick="document.getElementById('dialogoBorrarIncidencia').close()">Cancelar</button>
                <button type="button" id="confirmarBorradoIncidencia" class="btn-danger-inc" onclick="confirmarBorradoIncidencia()">Sí, borrar</button>
            </div>
        </div>
    </dialog>
</body>
</html>
