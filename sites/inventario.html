<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const g=localStorage.getItem("dm-theme");document.documentElement.dataset.theme=g==="dark"||g==="light"?g:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(_){document.documentElement.dataset.theme="light"}</script>
    <title>Inventario | SGRSI</title>
    <link rel="icon" type="image/webp" href="../src/shared/assets/logo.webp">
    <link rel="stylesheet" href="../src/shared/styles/entradas/internas.css">
    <script type="module" src="../src/app/entries/inventory.page.js"></script>
</head>
<body>
    <button type="button" class="dark-btn" onclick="toggleDark()" aria-label="Cambiar a modo oscuro"><i data-icon="luna" class="theme-icon-moon"></i><i data-icon="sol" class="theme-icon-sun" hidden></i></button>

    <!-- Formulario para agregar/editar (solo admin) -->
    <div id="formInventario" class="card" style="display:none;">
        <h1 id="tituloFormInventario">Agregar Equipo</h1>
        <input type="hidden" id="idEditando" value="">
        <label for="nombre">Nombre del equipo</label><input type="text" id="nombre" required>
        <label for="tipo">Tipo</label><select id="tipo">
            <option value="">Seleccione tipo</option>
            <option value="Computadora">Computadora</option>
            <option value="Monitor">Monitor</option>
            <option value="Teclado">Teclado</option>
            <option value="Mouse">Mouse</option>
            <option value="Impresora">Impresora</option>
            <option value="Otro">Otro</option>
        </select>
        <label for="marca">Marca</label><input type="text" id="marca">
        <label for="modelo">Modelo</label><input type="text" id="modelo">
        <label for="numero_serie">Número de serie</label><input type="text" id="numero_serie">
        <label for="estado">Estado</label><select id="estado">
            <option value="activo">Activo</option>
            <option value="en_reparacion">En reparación</option>
            <option value="de_baja">De baja</option>
        </select>
        <label for="ubicacion_id">Ubicación exacta</label><select id="ubicacion_id" required><option value="">Seleccione una ubicación</option></select>
        <label for="descripcion">Descripción (opcional)</label><input type="text" id="descripcion">
        <label for="cantidad">Cantidad</label><input type="number" id="cantidad" min="1" value="1">
        <p id="errorInventario"></p>
        <p id="estadoInventario" class="feedback" role="status" aria-live="polite"></p>
        <button onclick="guardarProducto()" id="btnGuardarInventario">Agregar equipo</button>
        <button onclick="cancelarEdicion()" id="btnCancelarEdicion" class="btn-secundario" style="display:none;">Cancelar edición</button>
    </div>

    <details id="panelUbicaciones" class="card" style="display:none;">
        <summary>Registrar una ubicación</summary>
        <label for="edificioUbicacion">Edificio o centro</label><input id="edificioUbicacion" value="ITI" required>
        <label for="tipoUbicacion">Tipo de espacio</label><select id="tipoUbicacion"><option value="laboratorio">Laboratorio</option><option value="salon">Salón</option><option value="administracion">Administración</option><option value="otro">Otro</option></select>
        <label for="nombreUbicacion">Nombre o número de sala</label><input id="nombreUbicacion" required>
        <label for="pisoUbicacion">Piso</label><input id="pisoUbicacion">
        <label for="referenciaUbicacion">Referencia exacta (sector, ala, etc.)</label><input id="referenciaUbicacion">
        <p id="errorUbicacion" class="feedback" role="alert"></p><p id="estadoUbicacion" class="feedback" role="status"></p>
        <button onclick="guardarUbicacion()">Guardar ubicación</button>
    </details>

    <section id="listaUbicaciones" class="section-container" style="display:none;">
        <h2>Ubicaciones registradas</h2>
        <div class="tabla-scroll"><table class="tabla-datos"><thead><tr><th>Edificio</th><th>Tipo</th><th>Espacio</th><th>Piso</th><th>Referencia</th><th>Acciones</th></tr></thead><tbody id="bodyUbicaciones"></tbody></table></div>
    </section>

    <!-- Tabla de inventario -->
    <div class="section-container">
        <h1>Inventario de Equipos</h1>
        <div class="tabla-scroll">
            <table class="tabla-datos" id="tablaInventario">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>N° Serie</th>
                        <th>Estado</th>
                        <th>Ubicación</th>
                        <th>Cant.</th>
                        <th id="colAcciones" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodyInventario">
                    <tr><td colspan="10">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
