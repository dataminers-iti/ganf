<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const modoOscuro=localStorage.getItem("modo")==="dark";document.documentElement.style.colorScheme=modoOscuro?"dark":"light";if(modoOscuro)document.documentElement.classList.add("dark")}catch(_){}</script>
    <title>SGRSI | ITI</title>
    <link rel="icon" type="image/png" href="src/shared/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="src/shared/styles/base.css?v=4">
    <link rel="stylesheet" href="src/shared/styles/tema.css?v=10">
    <link rel="stylesheet" href="src/shared/styles/componentes.css?v=4">
    <link rel="stylesheet" href="src/shared/styles/layout.css?v=15">
    <script type="module" src="src/app/entries/login.page.js"></script>
</head>
<body>
    <!-- PÁGINA DE LOGIN -->
    <button class="dark-btn" onclick="toggleDark()"><i class="bi bi-moon-stars-fill theme-icon-moon" aria-hidden="true"></i><i class="bi bi-sun-fill theme-icon-sun" aria-hidden="true" hidden></i></button>

    <div class="login-container">
        <div class="card">
            <h1>Iniciar Sesión</h1>
            <label for="correo">Correo</label><input type="email" id="correo" required>
            <label for="clave">Contraseña</label><input type="password" id="clave" required>
            <p id="errorLogin" style="color:red;"></p>
            <button onclick="login()">Ingresar</button>
            <p>¿No tienes cuenta? <a onclick="mostrarRegistro()">Regístrate</a></p>
        </div>
    </div>
</body>
</html>
