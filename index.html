<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const g=localStorage.getItem("dm-theme");document.documentElement.dataset.theme=g==="dark"||g==="light"?g:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(_){document.documentElement.dataset.theme="light"}</script>
    <title>SGRSI | ITI</title>
    <link rel="icon" type="image/webp" href="src/shared/assets/logo.webp">
    <link rel="stylesheet" href="src/shared/styles/entradas/publicas.css">
    <script type="module" src="src/app/entries/login.page.js"></script>
</head>
<body>
    <!-- PÁGINA DE LOGIN -->
    <button type="button" class="dark-btn" onclick="toggleDark()" aria-label="Cambiar a modo oscuro"><i data-icon="luna" class="theme-icon-moon"></i><i data-icon="sol" class="theme-icon-sun" hidden></i></button>

    <main class="login-container">
        <div class="acceso-panel">
            <div class="acceso-marca"><img src="src/shared/assets/logo.webp" alt="" width="40" height="40"><span>SGRSI <small>ITI</small></span></div>
            <div class="card">
            <h1>Iniciar Sesión</h1>
            <label for="correo">Correo</label><input type="email" id="correo" required>
            <label for="clave">Contraseña</label><input type="password" id="clave" required>
            <p id="errorLogin"></p>
            <button onclick="login()">Ingresar</button>
            <p>¿No tienes cuenta? <a href="#" onclick="mostrarRegistro(); return false;">Regístrate</a></p>
        </div>
        </div>
        <div class="acceso-imagen" aria-hidden="true"></div>
    </main>
</body>
</html>
