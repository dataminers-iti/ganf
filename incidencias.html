<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const modoOscuro=localStorage.getItem("modo")==="dark";document.documentElement.style.colorScheme=modoOscuro?"dark":"light";if(modoOscuro)document.documentElement.classList.add("dark")}catch(_){}</script>
    <title>Incidencias | SGRSI</title>
    <link rel="icon" type="image/png" href="ico logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="base.css?v=3">
    <link rel="stylesheet" href="tema.css?v=7">
    <link rel="stylesheet" href="componentes.css?v=3">
    <link rel="stylesheet" href="layout.css?v=8">
    <script src="navegacion.js?v=3" defer></script>
    <script src="autenticacion.js?v=3" defer></script>
    <script src="incidencias.js?v=3" defer></script>
    <script src="tema.js?v=5" defer></script>
</head>
<body class="page-incidencias">
    <button class="dark-btn" onclick="toggleDark()"><span class="theme-icon-moon" aria-hidden="true">☾</span><span class="theme-icon-sun" aria-hidden="true" hidden>☀</span></button>

    <!-- Formulario para crear incidencia -->
    <div class="card incidence-form">
        <div class="incidence-heading"><span class="incidence-kicker">Mesa de ayuda</span><h1>Registrar incidencia</h1><p>Contanos qué pasó y dónde ocurrió para que podamos ayudarte.</p></div>
        <div class="incidence-fields">
        <div class="incidence-field incidence-field-wide"><label for="titulo">Título de la incidencia</label><input type="text" id="titulo" required></div>
        <div class="incidence-field incidence-field-wide"><label for="descripcionIncidencia">Descripción del problema</label><textarea id="descripcionIncidencia" required rows="3"></textarea></div>
        <div class="incidence-field"><label for="area">Área o departamento</label><input type="text" id="area" required></div>
        <div class="incidence-field"><label for="prioridadIncidencia">Prioridad</label><select id="prioridadIncidencia">
            <option value="media">Prioridad: Media</option>
            <option value="alta">Prioridad: Alta</option>
            <option value="baja">Prioridad: Baja</option>
        </select></div>
        </div>
        <p id="errorIncidencia" style="color:red;"></p>
        <p id="estadoIncidencia" class="feedback" role="status" aria-live="polite"></p>
        <button onclick="guardarIncidencia()">Guardar incidencia</button>
    </div>

    <!-- Tabla de incidencias -->
    <div class="section-container incidence-list">
        <div class="incidence-list-heading"><div><span class="incidence-kicker">Seguimiento</span><h2>Incidencias registradas</h2></div><span class="incidence-list-caption">Consultá el estado de los reportes</span></div>
        <div style="overflow-x: auto;">
            <table class="tabla-datos" id="tablaIncidencias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Área</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Reportado por</th>
                        <th>Asignado a</th>
                        <th>Fecha</th>
                        <th id="colAccionesInc" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodyIncidencias">
                    <tr><td colspan="10">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
