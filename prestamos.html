<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos | SGRSI</title><link rel="icon" type="image/png" href="ico logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="base.css?v=3"><link rel="stylesheet" href="tema.css?v=3"><link rel="stylesheet" href="componentes.css?v=3"><link rel="stylesheet" href="layout.css?v=3">
    <script src="navegacion.js?v=3" defer></script><script src="autenticacion.js?v=3" defer></script><script src="prestamos.js?v=3" defer></script><script src="tema.js?v=3" defer></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()" aria-label="Cambiar tema">◑</button>
    <div class="section-container" style="max-width:1200px;margin:20px auto">
        <h1>Préstamos de equipos</h1>
        <form id="formPrestamo" class="card" style="max-width:520px" onsubmit="event.preventDefault(); solicitarPrestamo()">
            <h2>Solicitar un préstamo</h2>
            <label for="equipoPrestamo">Equipo disponible</label><select id="equipoPrestamo" required><option value="">Cargando equipos…</option></select>
            <label for="motivoPrestamo">Motivo</label><textarea id="motivoPrestamo" required minlength="5" rows="3"></textarea>
            <label for="cantidadPrestamo">Cantidad</label><input type="number" id="cantidadPrestamo" min="1" value="1" required>
            <label for="fechaPrestamo">Fecha prevista de devolución (opcional)</label><input type="date" id="fechaPrestamo">
            <p id="errorPrestamo" class="feedback" role="alert" aria-live="polite"></p><p id="estadoPrestamo" class="feedback" role="status" aria-live="polite"></p>
            <button type="submit">Enviar solicitud</button>
        </form>
        <div style="overflow-x:auto"><table class="tabla-datos"><thead><tr><th>Equipo</th><th>Serie</th><th>Solicitante</th><th>Solicitud</th><th>Devolución prevista</th><th>Estado</th><th id="colAccionesPrestamo" style="display:none">Acciones</th></tr></thead><tbody id="bodyPrestamos"><tr><td colspan="7">Cargando…</td></tr></tbody></table></div>
    </div>
</body>
</html>
