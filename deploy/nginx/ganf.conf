# /etc/nginx/sites-available/ganf.conf  (ajustar server_name y TLS)
#
# El deploy reescribe SOLO /etc/nginx/snippets/ganf-upstream.conf con una línea:
#   server 127.0.0.1:4161;   # blue
#   server 127.0.0.1:4162;   # green
# Crear el snippet inicial a mano apuntando a blue antes del primer deploy.
upstream ganf {
    include /etc/nginx/snippets/ganf-upstream.conf;
}

server {
    listen 80;
    server_name ganf.example.com;

    location / {
        proxy_pass http://ganf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
