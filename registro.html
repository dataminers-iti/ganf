<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script>try{const modoOscuro=localStorage.getItem("modo")==="dark";document.documentElement.style.colorScheme=modoOscuro?"dark":"light";if(modoOscuro)document.documentElement.classList.add("dark")}catch(_){}</script>
    <title>Registro | SGRSI</title>
    <link rel="icon" type="image/png" href="ico logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="base.css?v=3">
    <link rel="stylesheet" href="tema.css?v=7">
    <link rel="stylesheet" href="componentes.css?v=3">
    <link rel="stylesheet" href="layout.css?v=8">
    <script src="navegacion.js?v=3" defer></script>
    <script src="autenticacion.js?v=3" defer></script>
    <script src="tema.js?v=5" defer></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()"><span class="theme-icon-moon" aria-hidden="true">☾</span><span class="theme-icon-sun" aria-hidden="true" hidden>☀</span></button>
    
    <div class="login-container">
        <div class="card">
            <h1>Crear Cuenta</h1>
            <label for="nuevoNombre">Nombre completo</label><input type="text" id="nuevoNombre" required>
            <label for="nuevoCorreo">Correo</label><input type="email" id="nuevoCorreo" required>
            <label for="nuevaClave">Contraseña</label><input type="password" id="nuevaClave" required minlength="8">
            <p id="errorRegistro" style="color:red;"></p>
            <p id="estadoRegistro" class="feedback" role="status" aria-live="polite"></p>
            <button onclick="registro()">Crear cuenta</button>
            <p>¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
